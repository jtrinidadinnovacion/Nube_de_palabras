<div class="app-drag-region"></div>
<div class="app-titlebar" [class.app-titlebar--principal]="enPrincipal()">
  <div class="app-titlebar__grupo" [class.app-titlebar__grupo--principal]="enPrincipal()">
    <button type="button" class="app-titlebar__icono-btn" aria-label="Minimizar" (click)="minimizar()">
      <img [src]="enPrincipal() ? 'img/prin_mini.png' : 'img/ini_mini.png'" alt="" />
    </button>
    <button
      type="button"
      class="app-titlebar__icono-btn"
      [attr.aria-label]="pantallaCompleta() ? 'Restaurar' : 'Maximizar'"
      (click)="alternarPantallaCompleta()"
    >
      <img [src]="iconoMaximizar()" alt="" />
    </button>
    <button type="button" class="app-titlebar__icono-btn app-titlebar__icono-btn--cerrar" aria-label="Cerrar" (click)="cerrar()">
      <img src="img/btn_cerrar.png" alt="" />
    </button>
  </div>
</div>
<router-outlet />
